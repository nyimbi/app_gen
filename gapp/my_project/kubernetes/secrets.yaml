apiVersion: v1 # Defines which version of this resource type is being used.
kind: Secret # Specifies that we're creating a new 'Secret' object.
metadata:
  name: my-project-secrets # Unique identifier for the secret. Change as necessary to avoid conflicts with existing names in your namespace(s).
  labels:                 # Optional labeling keys can be added here (e.g., app=my_project, env=production) for better categorization and filtering later on.
    project-name: "my_project"
data:
  database_password:     # Each piece of data within the secret should have an appropriate key that describes its purpose. Use 'base64 encoded' string format when providing values (do not include line breaks or extra spaces).
    valueFromEnvVar: "<YOUR_BASE64_ENCODED_VALUE_HERE>"
  api_key:               # Additional keys can be added according to what secrets are required for your application.
    username1: <REPLACE_WITH_128_BIT_KEY>
    password2:           # Add as many key-value pairs under data as needed. Each should also have an appropriately descriptive name and a 'base64 encoded' value (do not include line breaks or extra spaces).
  sensitive_info3:      # Continue with any additional secrets that your application might require.
    secretData: "secretValue"
# Note on best practices:
# - Avoid hardcoding values directly in this file. Instead, use environment variables to inject these into the container at runtime (e.g., using KEDA or custom scripts).
# - Make sure not all sensitive information is stored here; limit what you place under 'data' as much and securely share only what's necessary.
# - Always keep secrets updated with minimal downtime for your application. Consider integrating secret management tools like HashiCorp Vault, AWS Secrets Manager, etc., if they fit into the architecture of "my_project".