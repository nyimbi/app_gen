yaml
# My Project documentation generated with MkDocs

site_name: 'My Project Documentation'  # The name of the site being built (displayed in nav bar)
repo_url: https://github.com/username/my_project   # URL to your project's repository or page where docs are hosted.
project_name: 'My Project'
tagline: ''
copyright: year
author:
- {name='Your Name', url='http://yourwebsite.example/'}

# Theme configuration can go here (change themes using `mkdocs serve --open`) - refer MkDocs for full list of theme options available

theme:
  name: readthedocs
  custom_dir: 'themes' # directory where your themes are located if you use a different one instead of the default "default"

# Enable search functionality and set it to look at all pages, including those created in mkdocs (do not include hidden files)
search_api: site.searchapi

plugins:
- search
- autolink  # Autodetect links for code blocks where possible.
- external-emphasis  # Emphasize text outside HTML tags.

# The following two lines are used to increase the visibility of documentation on GitHub Pages by enabling a light theme and increasing contrast with dark background colors:

nav_center: true
dark_mode_css:
    - 'https://cdn.jsdelivr.net/npm/mkdocs-material@6.4.5/css/material.css'
  # Change color scheme for better accessibility (you can also use custom CSS in themes to further customize this):
color_scheme_file: 'light_color_theme.yml'

markdown_extensions:
- toc:
    permalink: '/{file.title}/'  # Link markdown files together with a consistent URL
versioning:
 - enabled: true

# Set the theme's default color scheme by adding these lines above. You can create your own themes here as well.
theme_options:

