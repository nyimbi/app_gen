{% extends "appbuilder/base.html" %}

{% block content %}
<div class="container">
    <h2>Final Step</h2>
    <p>This is step 3 of 3. Let's set your preferences.</p>
    <form method="post">
        <div class="form-group">
            <label for="interests">Interests (comma-separated)</label>
            <input type="text" class="form-control" id="interests" name="interests">
        </div>
        <div class="form-group">
            <label for="skills">Skills (comma-separated)</label>
            <input type="text" class="form-control" id="skills" name="skills">
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="is_volunteer" name="is_volunteer">
            <label class="form-check-label" for="is_volunteer">I'm interested in volunteering</label>
        </div>
        <button type="submit" class="btn btn-primary">Complete Profile</button>
    </form>
</div>
{% endblock %}
