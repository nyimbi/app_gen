{% extends "appbuilder/base.html" %}

{% block content %}
<div class="panel panel-primary">
    <div class="panel-heading">
        <h3 class="panel-title">{{ _('Personalize View') }}</h3>
    </div>
    <div class="panel-body">
        <form method="post">
            <div class="form-group">
                <label>{{ _('Select Columns to Display') }}</label>
                <select multiple class="form-control" name="columns">
                    {% for column in columns %}
                    <option value="{{ column }}" {% if column in current_columns %}selected{% endif %}>{{ column|capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>{{ _('Sort Order') }}</label>
                <select class="form-control" name="order">
                    {% for column in columns %}
                    <option value="{{ column }}" {% if column == current_order %}selected{% endif %}>{{ column|capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            <a href="{{ url_for(modelview_name + '.list') }}" class="btn btn-default">{{ _('Cancel') }}</a>
        </form>
    </div>
</div>
{% endblock %}
