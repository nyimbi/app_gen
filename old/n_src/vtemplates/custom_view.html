{% extends "appbuilder/base.html" %}
{% block content %}
<h2>Custom View</h2>
<p>This is a custom view. You can add any content or functionality here.</p>
<div>
    {{ mywidget }}
</div>
<div class="row">
    <div class="col-md-6">
        <h3>Sample Chart</h3>
        <canvas id="myChart"></canvas>
    </div>
    <div class="col-md-6">
        <h3>Sample Data</h3>
        <table id="dataTable" class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>View</th>
                    <th>Record Count</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block tail_js %}
{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
$(document).ready(function() {
    // Load data for the table
    $.getJSON("{{ url_for('.api_data') }}", function(data) {
        var tableBody = $('#dataTable tbody');
        $.each(data, function(index, item) {
            tableBody.append(
                '<tr><td>' + item.name + '</td><td>' + item.count + '</td></tr>'
            );
        });
    });

    // Load data for the chart
    $.getJSON("{{ url_for('.api_chart_data') }}", function(data) {
        var ctx = document.getElementById('myChart').getContext('2d');
        var firstDataset = Object.values(data)[0];
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: firstDataset.labels,
                datasets: [{
                    label: 'Record Count',
                    data: firstDataset.datasets[0].data,
                    backgroundColor: 'rgba(75, 192, 192, 0.6)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
});
</script>
{% endblock %}
