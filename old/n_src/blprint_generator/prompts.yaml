domain_research: |
  Perform domain research and identify best practices for the following Flask-AppBuilder blueprint:
  {blueprint}
  
  Provide a comprehensive overview of:
  1. Latest trends and best practices in this domain
  2. Common pitfalls and how to avoid them
  3. Scalability considerations
  4. Security best practices

architecture_planning: |
  Based on the following domain knowledge and blueprint description, 
  plan a scalable and maintainable architecture:
  
  Blueprint: {blueprint}
  Domain Knowledge: {domain_knowledge}
  
  Provide a detailed architecture plan including:
  1. High-level component diagram
  2. Data flow between components
  3. Scalability strategies
  4. Maintainability considerations

product_specification: |
  Develop a detailed product specification for the following blueprint:
  
  Blueprint: {blueprint}
  Architecture: {architecture}
  
  Include:
  1. Functional requirements
  2. Non-functional requirements
  3. User stories
  4. API specifications (if applicable)
  5. Database schema (if applicable)

file_structure_planning: |
  Plan the file structure and component organization for the following blueprint:
  
  Specification: {specification}
  
  Provide a detailed file structure including:
  1. All necessary Python files (models.py, views.py, forms.py, etc.)
  2. Template directory structure
  3. Static file organization
  4. Test file structure

generate_code: |
  Generate code for {file} based on the following specification:
  
  Specification: {specification}
  File Structure: {file_structure}
  
  Ensure the code follows PEP 8 style guidelines and includes proper
  type hints and docstrings.

generate_tests: |
  Generate comprehensive unit tests for the following code:
  
  {code}
  
  Ensure high test coverage and include edge cases.

refine_code: |
  Refine the following code to address pylint and mypy issues:
  
  Code: {code}
  Pylint results: {pylint_results}
  Mypy results: {mypy_results}

generate_documentation: |
  Generate comprehensive documentation for the following blueprint:
  
  Specification: {specification}
  Generated Code: {generated_code}
  
  Include:
  1. Setup and installation instructions
  2. Usage guide
  3. API documentation (if applicable)
  4. Database schema documentation (if applicable)

create_configurations: |
  Create containerization (Dockerfile) and CI/CD configurations for the following blueprint:
  
  Specification: {specification}
  File Structure: {file_structure}
  
  Provide:
  1. Dockerfile
  2. docker-compose.yml (if necessary)
  3. GitLab CI/CD or GitHub Actions configuration

generate_requirements: |
  Based on the generated code and specifications, create a requirements.txt file listing all necessary Python packages and their versions for this blueprint:

  Specification: {specification}
  Generated Code: {generated_code}

security_review: |
  Perform a security review of the following code, focusing on:
  1. Input validation
  2. Authentication and authorization
  3. Data encryption
  4. SQL injection prevention
  5. XSS prevention
  6. CSRF protection

  Generated Code: {generated_code}

  Provide suggestions for any security improvements.

performance_test: |
  Generate performance tests for the critical paths in this blueprint:

  Specification: {specification}
  Generated Code: {generated_code}

  Include tests for:
  1. Database query performance
  2. API response times (if applicable)
  3. Load testing scenarios

generate_api_docs: |
  Generate OpenAPI/Swagger documentation for the APIs in this blueprint:

  Specification: {specification}
  Generated Code: {generated_code}

generate_migrations: |
  Generate initial database migration scripts for the models in this blueprint:

  Models: {models}

