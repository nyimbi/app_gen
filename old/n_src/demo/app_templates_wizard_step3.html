{% extends "wizard_base.html" %}
{% block wizard_title %}Step 3: Use Case{% endblock %}
{% block wizard_content %}
<form method="post">
    {{ form.hidden_tag() }}
    <div class="form-group">
        {{ form.use_case.label }}
        {{ form.use_case(class="form-control", rows=5) }}
    </div>
    <button type="submit" class="btn btn-primary">Complete Onboarding</button>
</form>
{% endblock %}
